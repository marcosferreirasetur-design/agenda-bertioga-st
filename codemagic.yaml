workflows:
  ios-simulator:
    name: Agenda ST iOS - Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Xcode version
        script: xcodebuild -version
      - name: Build unsigned simulator app
        script: |
          set -e
          xcodebuild \
            -project ios/AgendaSTBertioga.xcodeproj \
            -scheme AgendaSTBertioga \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build
    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog

  ios-simulator-screenshot:
    name: Agenda ST iOS - Simulator + Screenshot
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Xcode version
        script: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Build simulator app
        script: |
          set -e
          xcodebuild \
            -project ios/AgendaSTBertioga.xcodeproj \
            -scheme AgendaSTBertioga \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Boot iPhone simulator
        script: |
          set -euo pipefail
          mkdir -p build/screenshots
          DEVICE_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $0 !~ /unavailable/ {for (i=1;i<=NF;i++) if ($i ~ /^[0-9A-Fa-f-]{36}$/) {print $i; exit}}')"
          [ -n "$DEVICE_UDID" ] || { echo "ERRO: nenhum iPhone Simulator disponivel."; exit 20; }
          echo "$DEVICE_UDID" > build/simulator-udid.txt
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Install and launch Agenda ST
        script: |
          set -euo pipefail
          DEVICE_UDID="$(cat build/simulator-udid.txt)"
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app"
          test -d "$APP_PATH" || { echo "ERRO: app compilado nao encontrado."; exit 21; }
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" br.gov.sp.bertioga.agendast
          sleep 15
          xcrun simctl io "$DEVICE_UDID" screenshot "build/screenshots/agenda-st-ios-home.png"

      - name: Capture second screenshot after load
        script: |
          set -euo pipefail
          DEVICE_UDID="$(cat build/simulator-udid.txt)"
          sleep 10
          xcrun simctl io "$DEVICE_UDID" screenshot "build/screenshots/agenda-st-ios-after-25s.png"

      - name: Simulator diagnostics
        script: |
          set +e
          xcrun simctl list
          ls -lh build/screenshots || true

    artifacts:
      - build/screenshots/*.png
      - build/simulator-udid.txt
      - build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog

  ios-full-ui-test:
    name: Agenda ST iOS - Teste Completo
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - agenda_st_test
    scripts:
      - name: Validar Secrets
        script: |
          set -e
          test -n "${TEST_EMAIL:-}" || { echo "ERRO: TEST_EMAIL ausente."; exit 10; }
          test -n "${TEST_PASSWORD:-}" || { echo "ERRO: TEST_PASSWORD ausente."; exit 11; }
          echo "OK: Secrets recebidos."

      - name: Build simulator
        script: |
          set -e
          xcodebuild -project ios/AgendaSTBertioga.xcodeproj -scheme AgendaSTBertioga -configuration Debug -sdk iphonesimulator -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO clean build

      - name: Boot e instalar
        script: |
          set -euo pipefail
          mkdir -p build/screenshots
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $0 !~ /unavailable/ {for(i=1;i<=NF;i++) if($i ~ /^[0-9A-Fa-f-]{36}$/){print $i; exit}}')"
          test -n "$UDID" || { echo "ERRO: simulador indisponivel."; exit 20; }
          echo "$UDID" > build/simulator-udid.txt
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app

      - name: Instalar Maestro
        script: |
          set -e
          export MAESTRO_CLI_NO_ANALYTICS=1
          curl -Ls https://get.maestro.mobile.dev | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: Testar Agenda ST
        script: |
          set -euo pipefail
          export MAESTRO_CLI_NO_ANALYTICS=1
          mkdir -p build/screenshots
          "$HOME/.maestro/bin/maestro" test -e TEST_EMAIL="$TEST_EMAIL" -e TEST_PASSWORD="$TEST_PASSWORD" .maestro/agenda-st-ios-full.yaml

      - name: Conferir capturas
        script: |
          set -e
          find build/screenshots -type f -name '*.png' -print
          test -f build/screenshots/01-login.png
          test -f build/screenshots/02-pos-login.png

    artifacts:
      - build/screenshots/*.png
      - build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app

  ios-login-diagnostic:
    name: Agenda ST iOS - Diagnostico Login
    instance_type: mac_mini_m2
