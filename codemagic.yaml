  ios-login-simctl-diagnostic:
    name: Agenda ST iOS - Login Screenshot Real
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - agenda_st_test

    scripts:
      - name: Validar Secrets
        script: |
          set -e
          test -n "${TEST_EMAIL:-}" || { echo "ERRO: TEST_EMAIL ausente."; exit 10; }
          test -n "${TEST_PASSWORD:-}" || { echo "ERRO: TEST_PASSWORD ausente."; exit 11; }
          echo "OK: Secrets recebidos."

      - name: Build simulator
        script: |
          set -e
          xcodebuild -project ios/AgendaSTBertioga.xcodeproj \
            -scheme AgendaSTBertioga -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO clean build

      - name: Boot e instalar
        script: |
          set -euo pipefail
          mkdir -p build/screenshots
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $0 !~ /unavailable/ {for(i=1;i<=NF;i++) if($i ~ /^[0-9A-Fa-f-]{36}$/){print $i; exit}}')"
          test -n "$UDID" || { echo "ERRO: simulador indisponivel."; exit 20; }
          echo "$UDID" > build/simulator-udid.txt
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app
          xcrun simctl launch "$UDID" br.gov.sp.bertioga.agendast
          sleep 15
          xcrun simctl io "$UDID" screenshot build/screenshots/01-login-real.png

      - name: Instalar Maestro
        script: |
          set -e
          export MAESTRO_CLI_NO_ANALYTICS=1
          curl -Ls https://get.maestro.mobile.dev | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: Efetuar login
        script: |
          set -euo pipefail
          export MAESTRO_CLI_NO_ANALYTICS=1
          UDID="$(cat build/simulator-udid.txt)"

          set +e
          "$HOME/.maestro/bin/maestro" test \
            -e TEST_EMAIL="$TEST_EMAIL" \
            -e TEST_PASSWORD="$TEST_PASSWORD" \
            .maestro/agenda-st-ios-login-simctl.yaml
          MAESTRO_STATUS=$?
          set -e

          echo "Maestro status: $MAESTRO_STATUS"
          sleep 3
          xcrun simctl io "$UDID" screenshot build/screenshots/02-pos-entrar-3s.png
          sleep 7
          xcrun simctl io "$UDID" screenshot build/screenshots/03-pos-entrar-10s.png
          sleep 15
          xcrun simctl io "$UDID" screenshot build/screenshots/04-pos-entrar-25s.png

          # O diagnóstico deve continuar mesmo se o Maestro reportar falha.
          exit 0

      - name: Conferir capturas reais
        script: |
          set -euo pipefail
          echo "Capturas SIMCTL:"
          find build/screenshots -type f -name '*.png' -print | sort
          test -s build/screenshots/01-login-real.png
          test -s build/screenshots/02-pos-entrar-3s.png
          test -s build/screenshots/03-pos-entrar-10s.png
          test -s build/screenshots/04-pos-entrar-25s.png
          file build/screenshots/*.png

    artifacts:
      - build/screenshots/*.png
      - build/simulator-udid.txt
      - build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app

  ios-login-real-telas:
    name: Agenda ST iOS - Login Real + Telas
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - agenda_st_test
    scripts:
      - name: Validar Secrets
        script: |
          set -e
          test -n "${TEST_EMAIL:-}" || exit 10
          test -n "${TEST_PASSWORD:-}" || exit 11
          echo "OK: Secrets recebidos."

      - name: Build simulator
        script: |
          set -e
          xcodebuild -project ios/AgendaSTBertioga.xcodeproj -scheme AgendaSTBertioga -configuration Debug -sdk iphonesimulator -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO clean build

      - name: Boot e instalar
        script: |
          set -euo pipefail
          mkdir -p build/screenshots
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $0 !~ /unavailable/ {for(i=1;i<=NF;i++) if($i ~ /^[0-9A-Fa-f-]{36}$/){print $i; exit}}')"
          test -n "$UDID"
          echo "$UDID" > build/simulator-udid.txt
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app
          xcrun simctl launch "$UDID" br.gov.sp.bertioga.agendast
          sleep 12
          xcrun simctl io "$UDID" screenshot build/screenshots/01-login.png

      - name: Instalar Maestro
        script: |
          set -e
          export MAESTRO_CLI_NO_ANALYTICS=1
          curl -Ls https://get.maestro.mobile.dev | bash

      - name: Login e capturas reais
        script: |
          set -euo pipefail
          export MAESTRO_CLI_NO_ANALYTICS=1
          UDID="$(cat build/simulator-udid.txt)"
          set +e
          "$HOME/.maestro/bin/maestro" test -e TEST_EMAIL="$TEST_EMAIL" -e TEST_PASSWORD="$TEST_PASSWORD" .maestro/agenda-st-ios-login-real.yaml
          set -e
          sleep 3
          xcrun simctl io "$UDID" screenshot build/screenshots/02-pos-entrar-3s.png
          sleep 7
          xcrun simctl io "$UDID" screenshot build/screenshots/03-pos-entrar-10s.png
          sleep 15
          xcrun simctl io "$UDID" screenshot build/screenshots/04-pos-entrar-25s.png

          # Tenta navegar após o login. Nenhuma ação de registro de ponto é executada.
          cat > /tmp/nav.yaml <<'FLOW'
          appId: br.gov.sp.bertioga.agendast
          ---
          - tapOn:
              point: "7%,7%"
              optional: true
          - tapOn:
              text: "Administração"
              optional: true
          - waitForAnimationToEnd
          FLOW
          set +e
          "$HOME/.maestro/bin/maestro" test /tmp/nav.yaml
          set -e
          sleep 2
          xcrun simctl io "$UDID" screenshot build/screenshots/05-administracao.png

          cat > /tmp/jornada.yaml <<'FLOW'
          appId: br.gov.sp.bertioga.agendast
          ---
          - tapOn:
              point: "7%,7%"
              optional: true
          - tapOn:
              text: "Jornada"
              optional: true
          - waitForAnimationToEnd
          FLOW
          set +e
          "$HOME/.maestro/bin/maestro" test /tmp/jornada.yaml
          set -e
          sleep 2
          xcrun simctl io "$UDID" screenshot build/screenshots/06-jornada-sem-registrar.png

          cat > /tmp/agenda.yaml <<'FLOW'
          appId: br.gov.sp.bertioga.agendast
          ---
          - tapOn:
              point: "7%,7%"
              optional: true
          - tapOn:
              text: "Agenda"
              optional: true
          - waitForAnimationToEnd
          FLOW
          set +e
          "$HOME/.maestro/bin/maestro" test /tmp/agenda.yaml
          set -e
          sleep 2
          xcrun simctl io "$UDID" screenshot build/screenshots/07-agenda.png

      - name: Conferir capturas
        script: |
          set -euo pipefail
          find build/screenshots -type f -name '*.png' -print | sort
          test -s build/screenshots/02-pos-entrar-3s.png
          test -s build/screenshots/04-pos-entrar-25s.png
          test -s build/screenshots/05-administracao.png
          test -s build/screenshots/06-jornada-sem-registrar.png
          test -s build/screenshots/07-agenda.png

    artifacts:
      - build/screenshots/*.png
      - build/simulator-udid.txt
      - build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app

  ios-debug-js-login-v132:
    name: Agenda ST iOS - Login JS Nativo V132
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - agenda_st_test
    scripts:
      - name: Validar Secrets
        script: |
          set -e
          test -n "${TEST_EMAIL:-}" || exit 10
          test -n "${TEST_PASSWORD:-}" || exit 11
      - name: Build DEBUG
        script: |
          set -e
          xcodebuild -project ios/AgendaSTBertioga.xcodeproj -scheme AgendaSTBertioga -configuration Debug -sdk iphonesimulator -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO clean build
      - name: Boot e login JS
        script: |
          set -euo pipefail
          mkdir -p build/screenshots
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $0 !~ /unavailable/ {for(i=1;i<=NF;i++) if($i ~ /^[0-9A-Fa-f-]{36}$/){print $i; exit}}')"
          test -n "$UDID"
          echo "$UDID" > build/simulator-udid.txt
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app
          SIMCTL_CHILD_AGENDA_ST_UI_TEST=1 SIMCTL_CHILD_AGENDA_ST_TEST_EMAIL="$TEST_EMAIL" SIMCTL_CHILD_AGENDA_ST_TEST_PASSWORD="$TEST_PASSWORD" xcrun simctl launch --terminate-running-process "$UDID" br.gov.sp.bertioga.agendast
          sleep 3
          xcrun simctl io "$UDID" screenshot build/screenshots/01-3s.png
          sleep 6
          xcrun simctl io "$UDID" screenshot build/screenshots/02-9s.png
          sleep 7
          xcrun simctl io "$UDID" screenshot build/screenshots/03-16s.png
          sleep 10
          xcrun simctl io "$UDID" screenshot build/screenshots/04-26s.png
      - name: Conferir
        script: |
          set -e
          find build/screenshots -type f -name '*.png' -print | sort
          test -s build/screenshots/04-26s.png
    artifacts:
      - build/screenshots/*.png
      - build/simulator-udid.txt
      - build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app

  ios-didfinish-v133:
    name: Agenda ST iOS - Diagnostico didFinish V133
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - agenda_st_test
    scripts:
      - name: Validar Secrets
        script: |
          set -e
          test -n "${TEST_EMAIL:-}" || exit 10
          test -n "${TEST_PASSWORD:-}" || exit 11
      - name: Build DEBUG
        script: |
          set -e
          xcodebuild -project ios/AgendaSTBertioga.xcodeproj -scheme AgendaSTBertioga -configuration Debug -sdk iphonesimulator -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO clean build
      - name: Boot e capturar log
        script: |
          set -euo pipefail
          mkdir -p build/screenshots build/logs
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $0 !~ /unavailable/ {for(i=1;i<=NF;i++) if($i ~ /^[0-9A-Fa-f-]{36}$/){print $i; exit}}')"
          test -n "$UDID"
          echo "$UDID" > build/simulator-udid.txt
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app
          xcrun simctl spawn "$UDID" log stream --style compact --level debug --predicate 'process == "AgendaSTBertioga"' > build/logs/app.log 2>&1 &
          LPID=$!
          SIMCTL_CHILD_AGENDA_ST_UI_TEST=1 SIMCTL_CHILD_AGENDA_ST_TEST_EMAIL="$TEST_EMAIL" SIMCTL_CHILD_AGENDA_ST_TEST_PASSWORD="$TEST_PASSWORD" xcrun simctl launch --terminate-running-process "$UDID" br.gov.sp.bertioga.agendast
          sleep 3
          xcrun simctl io "$UDID" screenshot build/screenshots/01-3s.png
          sleep 5
          xcrun simctl io "$UDID" screenshot build/screenshots/02-8s.png
          sleep 7
          xcrun simctl io "$UDID" screenshot build/screenshots/03-15s.png
          sleep 10
          xcrun simctl io "$UDID" screenshot build/screenshots/04-25s.png
          kill "$LPID" >/dev/null 2>&1 || true
      - name: Conferir diagnostico
        script: |
          set -e
          echo "=== MARCADORES LOGIN ==="
          grep -E 'AGENDA_ST_DEBUG_LOGIN|WKWebView|didFinish' build/logs/app.log | tail -n 100 || true
          echo "=== PNGS ==="
          find build/screenshots -type f -name '*.png' -print | sort
          test -s build/screenshots/04-25s.png
    artifacts:
      - build/screenshots/*.png
      - build/logs/app.log
      - build/simulator-udid.txt
      - build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app

  ios-source-structure-v134:
    name: Agenda ST iOS - Estrutura Swift V134
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: latest
    scripts:
      - name: Extrair estrutura Swift
        script: |
          set -euo pipefail
          mkdir -p build/diagnostico
          grep -RIn --include='*.swift' -E 'class |WKWebView|WKNavigationDelegate|navigationDelegate|didFinish|\.load\(|agenda-externa-st\.web\.app' ios > build/diagnostico/estrutura-swift.txt || true
          cp ios/AgendaSTBertioga/*.swift build/diagnostico/ 2>/dev/null || true
          cat build/diagnostico/estrutura-swift.txt
    artifacts:
      - build/diagnostico/*

