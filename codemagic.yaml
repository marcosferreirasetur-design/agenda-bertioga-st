workflows:
  ios-simulator:
    name: Agenda ST iOS - Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Xcode version
        script: xcodebuild -version
      - name: Build unsigned simulator app
        script: |
          set -e
          xcodebuild \
            -project ios/AgendaSTBertioga.xcodeproj \
            -scheme AgendaSTBertioga \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build
    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
