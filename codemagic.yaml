            -project ios/AgendaSTBertioga.xcodeproj \
            -scheme AgendaSTBertioga \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO clean build

      - name: Boot e instalar
        script: |
          set -euo pipefail
          mkdir -p build/screenshots
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $0 !~ /unavailable/ {for(i=1;i<=NF;i++) if($i ~ /^[0-9A-Fa-f-]{36}$/){print $i; exit}}')"
          test -n "$UDID" || { echo "ERRO: simulador indisponivel."; exit 20; }
          echo "$UDID" > build/simulator-udid.txt
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/AgendaSTBertioga.app

      - name: Instalar Maestro
        script: |
